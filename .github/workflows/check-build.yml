name: Check Docker Build

on:
  pull_request:
    branches:
      - main

jobs:
  check-docker-build:
    name: Check Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the combined Steel Browser image
        run: docker build --platform linux/amd64 -t steel-browser .
