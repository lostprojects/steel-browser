services:
  toolstack:
    build: .
    platform: linux/amd64
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - profiles:/data
    environment:
      DOMAIN: localhost:3000
      USE_SSL: "false"
      TOOLSTACK_ORG_ID: ${TOOLSTACK_ORG_ID:-00000000-0000-4000-8000-000000000001}
      TOOLSTACK_ORG_NAME: ${TOOLSTACK_ORG_NAME:-My organization}
      STEEL_API_KEY: ${STEEL_API_KEY:?Set STEEL_API_KEY before starting Toolstack}
      CHROME_HEADLESS: "false"
      ENABLE_COMMANDS_API: "true"
      CAPTURE_CONSOLE_EVENTS: "false"
      ENABLE_PDF_VIEWER: "true"
      MAX_SESSIONS: "3"
      RAILWAY_DEPLOYMENT_DRAINING_SECONDS: "120"
    stop_grace_period: 130s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  profiles:
